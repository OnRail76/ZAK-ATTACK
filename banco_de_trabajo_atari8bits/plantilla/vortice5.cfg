# Vórtice 5 · ld65
MEMORY {
    ZP:   start = $0080, size = $0080, type = rw, define = yes;
    INIT: start = $0600, size = $0100, type = rw, file = "build/init.bin";
    MAIN: start = $2000, size = $8000, type = rw, file = "build/main.bin";
    HI:   start = $B000, size = $0300, type = rw, file = "";   # hueco libre bajo los misiles (PMG de 1 línea)
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    INITSEG:  load = INIT, type = rw;
    CODE:     load = MAIN, type = rw;
    BSS:      load = MAIN, type = bss, define = yes;
    HIBSS:    load = HI,   type = bss;
}
